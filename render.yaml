services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: vyapar-memory-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vyapar-memory-db
          property: connectionString

  # 2. Vite React Frontend Static Site
  - type: static
    name: vyapar-memory-frontend
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vyapar-memory-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: vyapar-memory-db
    region: singapore
    plan: free
    postgresMajorVersion: 16
