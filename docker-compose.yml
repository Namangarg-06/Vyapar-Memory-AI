version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vyapar-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyapar
      POSTGRES_PASSWORD: vyapar_password
      POSTGRES_DB: vyapar_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapar -d vyapar_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyapar-memory-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://vyapar:vyapar_password@db:5432/vyapar_memory
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - upload_data:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyapar-memory-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  upload_data:
